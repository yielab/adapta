# ──────────────────────────────────────────────────────────────────────────────
# GPU overlay — opt-in CUDA pass-through for the training worker.
#
# WHY an overlay instead of the base file:
#   A device reservation (`count: 1`, driver nvidia) makes `docker compose up`
#   FAIL on hosts without the nvidia-container-toolkit. The product must start
#   cleanly on CPU-only hosts (RAG serving needs no GPU), so the reservation is
#   opt-in: only merged when the operator explicitly adds this file.
#
# WHY an overlay instead of a `profiles:` entry:
#   The worker is always-on (it must run so a CPU-only host can fail jobs fast
#   with a clear "GPU required" message). A profile only toggles whether a
#   service starts — it can't *add* a device reservation to an already-running
#   service. An overlay layers the reservation onto the same worker.
#
# Prerequisites on the host (one-time, needs sudo — see TODO §4.2b):
#   1. NVIDIA driver (this host: 590.x, verified via `nvidia-smi`).
#   2. nvidia-container-toolkit + `sudo nvidia-ctk runtime configure --runtime=docker`
#      + `sudo systemctl restart docker`.
#
# Run (GPU worker):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Verify torch sees the GPU inside the worker:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml logs worker | grep "GPU ready"
# ──────────────────────────────────────────────────────────────────────────────
services:
  worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
