[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapta"
version = "0.1.0"
description = "Self-hosted RAG + LoRA model-customization platform — your data never leaves your infrastructure"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Santiago Yie"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # Web framework
    # fastapi: <1 — pre-1.0, minors may drop deprecated APIs and bump the starlette major
    # the routers/middleware use. Working set: 0.143.
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.27.0",
    # pydantic: <3 — the generated DTOs (datamodel-codegen) and settings target v2 semantics.
    # Working set: 2.14.
    "pydantic[email]>=2.6.0,<3",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    # Database
    # sqlalchemy[asyncio]: the extra declares greenlet explicitly — SQLAlchemy 2.1 dropped it
    # as a hard dependency and a rebuild then failed at `import sqlalchemy.ext.asyncio` in
    # app and worker. <3: a major changes the async/session API. Working set: 2.1.4.
    "sqlalchemy[asyncio]>=2.0.25,<3",
    # asyncpg: <1 — pre-1.0 minors have broken the SQLAlchemy asyncpg dialect. Working set: 0.32.
    "asyncpg>=0.29.0,<1",
    # alembic: <2 — a major changes the env.py/autogenerate API migrations/env.py uses.
    # Working set: 1.20.
    "alembic>=1.13.0,<2",
    # Cache / job queue
    # redis: <9 — the BLPOP job queue and progress keys use the client API; majors change
    # return types/decoding. Working set: 8.1.
    "redis[hiredis]>=5.0.0,<9",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    # Inference (llama-cpp — CPU by default; GPU variant installed separately)
    "llama-cpp-python>=0.2.55",
    # Embeddings + vector store. sentence-transformers needs torch and transformers;
    # their ceilings live here. torch: <3 — a minor/major move changes kernels and wheel
    # layout (2.14 on the 2026-09-17 rebuild broke the stack, E1.9). Working set: 2.14.
    # transformers: <6 — majors rename/remove tokenizer and model APIs. Working set: 5.17.
    "torch>=2.2.0,<3",
    "transformers>=4.38.0,<6",
    "sentence-transformers>=2.3.1",
    # PEFT->GGUF LoRA conversion (core/adapter_conversion.py): llama.cpp's
    # convert_lora_to_gguf.py imports the `gguf` writer and reads safetensors.
    "gguf>=0.10.0",
    "safetensors>=0.4.0",
    # chromadb: EXACT pin, must equal the chromadb/chroma image tag in docker-compose.yml
    # (client/server skew -> KeyError('_type') 500 on all indexing). `make check-chroma` guards it.
    "chromadb==1.5.9",
    # Document parsing + image decoding for vision chat
    "pillow>=10.0.0",
    # One document parser (E3.3b): PDF/DOCX/HTML/images, layout + tables, RapidOCR for scans.
    # torchvision comes from the +cpu index in the Dockerfile's torch layer (PyPI's wheel
    # does not match the CPU-only torch).
    "docling[rapidocr]>=2.137,<3",
    # General
    "httpx>=0.26.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/yielab/adapta"
Repository = "https://github.com/yielab/adapta"
Issues = "https://github.com/yielab/adapta/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=24.1.1",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
    # SDD toolchain
    "datamodel-code-generator>=0.25.0",
    # schemathesis: <5 — majors change the CLI/pytest-plugin API and checks; 4.27.3 turned
    # `make test-contracts` red (E1.11). Working set: 4.27.
    "schemathesis>=3.28.0,<5",
    "openapi-spec-validator>=0.7.0",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adapta*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: schemathesis tests requiring a live server on :8000",
    "integration: tests requiring real Postgres/Redis/Chroma",
    "slow: real llama-cpp inference on a tiny model",
]
addopts = "-m 'not contract and not integration and not slow'"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B008",  # FastAPI Depends() in route default args is intentional
    "E501",  # line-too-long: black handles formatting, ruff just checks
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Protected internals — wrapped, not rewritten (hard constraint #1)
[[tool.mypy.overrides]]
module = [
    "adapta.core.inference",
    "adapta.core.model_manager",
    "adapta.core.gpu",
    "adapta.core.metrics",
]
ignore_errors = true

# ── Layered-architecture contract (§1.9) — enforced by `make lint-imports` ─────
# Keeps the dependency arrows pointing inward: the domain core stays free of the
# web/service layers, and services never reach up into the API layer.
[tool.importlinter]
root_package = "adapta"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is dependency-free of the outer layers"
type = "forbidden"
source_modules = ["adapta.domain"]
forbidden_modules = ["adapta.api", "adapta.services", "adapta.core", "fastapi"]

[[tool.importlinter.contracts]]
name = "Services must not import the API layer"
type = "forbidden"
source_modules = ["adapta.services"]
forbidden_modules = ["adapta.api"]
