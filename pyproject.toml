[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapta"
version = "0.1.0"
description = "Self-hosted RAG + LoRA model-customization platform — your data never leaves your infrastructure"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Santiago Yie"}
]
license = {text = "MIT"}
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Cache / job queue
    "redis[hiredis]>=5.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    # Inference (llama-cpp — CPU by default; GPU variant installed separately)
    "llama-cpp-python>=0.2.55",
    # Embeddings + vector store
    "sentence-transformers>=2.3.1",
    "chromadb==1.5.9",  # pinned in sync with the chroma server image (docker-compose.yml)
    # Document parsing + dataset-image validation (§V2 — bundle images are
    # decoded/checked at upload time in the app, not just in the worker)
    "pillow>=10.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "markdown>=3.5.0",
    # General
    "httpx>=0.26.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/santiagoyie/adapta"
Repository = "https://github.com/santiagoyie/adapta"
Issues = "https://github.com/santiagoyie/adapta/issues"

[project.optional-dependencies]
training = [
    "torch>=2.2.0",
    # torchvision pairs with torch (VLM processors import it — §V image fine-tune).
    "torchvision",
    "transformers>=4.38.0",
    "peft>=0.8.2",
    "datasets>=2.16.1",
    "trl>=0.7.10",
    "bitsandbytes>=0.42.0",
    "accelerate>=0.27.0",
    # PEFT→GGUF LoRA conversion for serving (A3.1): llama.cpp's convert_lora_to_gguf.py
    # imports the `gguf` writer package and reads safetensors. torch/transformers above
    # cover the rest of its model-introspection needs.
    "gguf>=0.10.0",
    "safetensors>=0.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=24.1.1",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
    # SDD toolchain
    "datamodel-code-generator>=0.25.0",
    "schemathesis>=3.28.0",
    "openapi-spec-validator>=0.7.0",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adapta*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: schemathesis tests requiring a live server on :8000",
    "integration: tests requiring real Postgres/Redis/Chroma",
    "slow: real llama-cpp inference on a tiny model",
]
addopts = "-m 'not contract and not integration and not slow'"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B008",  # FastAPI Depends() in route default args is intentional
    "E501",  # line-too-long: black handles formatting, ruff just checks
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Protected internals — wrapped, not rewritten (hard constraint #1)
[[tool.mypy.overrides]]
module = [
    "adapta.core.inference",
    "adapta.core.model_manager",
    "adapta.training.trainer",
    "adapta.training.evaluator",
    "adapta.core.gpu",
    "adapta.core.metrics",
]
ignore_errors = true

# ── Layered-architecture contract (§1.9) — enforced by `make lint-imports` ─────
# Keeps the dependency arrows pointing inward: the domain core stays free of the
# web/service layers, and services never reach up into the API layer.
[tool.importlinter]
root_package = "adapta"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is dependency-free of the outer layers"
type = "forbidden"
source_modules = ["adapta.domain"]
forbidden_modules = ["adapta.api", "adapta.services", "adapta.core", "fastapi"]

[[tool.importlinter.contracts]]
name = "Services must not import the API layer"
type = "forbidden"
source_modules = ["adapta.services"]
forbidden_modules = ["adapta.api"]
