<!-- Model Catalog Tab Content (to be inserted into main dashboard) -->
<div id="catalog-tab" class="tab-content" style="display:none;">
    <div class="card">
        <h2>📦 Model Catalog</h2>
        <p style="color: #94a3b8; margin-bottom: 20px;">
            Browse and download available models from Hugging Face
        </p>

        <!-- Filter buttons -->
        <div style="margin-bottom: 20px;">
            <button onclick="filterModels('all')" class="btn btn-secondary">All Models</button>
            <button onclick="filterModels('installed')" class="btn btn-secondary">Installed</button>
            <button onclick="filterModels('available')" class="btn btn-secondary">Available</button>
            <button onclick="filterModels('recommended')" class="btn btn-success">Recommended</button>
            <button onclick="filterModels('required')" class="btn btn-primary">Required</button>
        </div>

        <!-- Model type filters -->
        <div style="margin-bottom: 20px;">
            <button onclick="filterType('all')" class="btn btn-sm">All Types</button>
            <button onclick="filterType('chat')" class="btn btn-sm">💬 Chat</button>
            <button onclick="filterType('code')" class="btn btn-sm">💻 Code</button>
            <button onclick="filterType('vision')" class="btn btn-sm">👁️ Vision</button>
            <button onclick="filterType('reasoning')" class="btn btn-sm">🧠 Reasoning</button>
        </div>

        <!-- Model grid -->
        <div id="model-grid" class="model-grid">
            <!-- Models will be inserted here by JavaScript -->
        </div>

        <!-- Active downloads -->
        <div id="downloads-section" style="margin-top: 30px; display: none;">
            <h3 style="color: #60a5fa; margin-bottom: 15px;">⏬ Active Downloads</h3>
            <div id="downloads-list">
                <!-- Active downloads will be shown here -->
            </div>
        </div>
    </div>
</div>

<style>
    .tab-nav {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        border-bottom: 2px solid #334155;
        padding-bottom: 10px;
    }

    .tab-btn {
        padding: 10px 20px;
        background: #334155;
        color: #e2e8f0;
        border: none;
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        transition: all 0.3s;
    }

    .tab-btn:hover {
        background: #475569;
    }

    .tab-btn.active {
        background: #60a5fa;
        color: #0f172a;
    }

    .tab-content {
        display: none;
    }

    .tab-content.active {
        display: block;
    }

    .model-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
    }

    .model-card {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 20px;
        transition: all 0.3s;
    }

    .model-card:hover {
        border-color: #60a5fa;
        box-shadow: 0 0 20px rgba(96, 165, 250, 0.2);
    }

    .model-card.installed {
        border-color: #10b981;
    }

    .model-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 15px;
    }

    .model-name {
        font-size: 1.1em;
        font-weight: bold;
        color: #e2e8f0;
        margin-bottom: 5px;
    }

    .model-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.75em;
        font-weight: bold;
        text-transform: uppercase;
    }

    .badge-installed {
        background: #10b981;
        color: #ffffff;
    }

    .badge-required {
        background: #ef4444;
        color: #ffffff;
    }

    .badge-recommended {
        background: #60a5fa;
        color: #ffffff;
    }

    .badge-chat { background: #8b5cf6; color: #fff; }
    .badge-code { background: #f59e0b; color: #fff; }
    .badge-vision { background: #ec4899; color: #fff; }
    .badge-reasoning { background: #10b981; color: #fff; }

    .model-description {
        color: #94a3b8;
        font-size: 0.9em;
        margin-bottom: 15px;
        min-height: 40px;
    }

    .model-meta {
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
        font-size: 0.85em;
    }

    .meta-item {
        color: #64748b;
    }

    .meta-value {
        color: #e2e8f0;
        font-weight: bold;
    }

    .model-actions {
        display: flex;
        gap: 10px;
    }

    .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9em;
        transition: all 0.3s;
        flex: 1;
        text-align: center;
    }

    .btn-primary {
        background: #60a5fa;
        color: #0f172a;
    }

    .btn-primary:hover {
        background: #3b82f6;
    }

    .btn-success {
        background: #10b981;
        color: #ffffff;
    }

    .btn-success:hover {
        background: #059669;
    }

    .btn-secondary {
        background: #475569;
        color: #e2e8f0;
    }

    .btn-secondary:hover {
        background: #334155;
    }

    .btn-sm {
        padding: 6px 12px;
        font-size: 0.85em;
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .progress-bar {
        width: 100%;
        height: 4px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 10px;
    }

    .progress-fill {
        height: 100%;
        background: #60a5fa;
        transition: width 0.3s;
    }

    .download-card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
    }
</style>

<script>
let catalogData = null;
let currentFilter = 'all';
let currentTypeFilter = 'all';

// Load catalog on page load
async function loadCatalog() {
    try {
        const response = await fetch('/dashboard/api/catalog');
        catalogData = await response.json();
        renderModels();
        checkDownloads();
    } catch (error) {
        console.error('Failed to load catalog:', error);
    }
}

function filterModels(filter) {
    currentFilter = filter;
    renderModels();
}

function filterType(type) {
    currentTypeFilter = type;
    renderModels();
}

function renderModels() {
    if (!catalogData) return;

    let models = catalogData.models;

    // Apply filters
    if (currentFilter === 'installed') {
        models = models.filter(m => m.installed);
    } else if (currentFilter === 'available') {
        models = models.filter(m => !m.installed);
    } else if (currentFilter === 'recommended') {
        models = models.filter(m => m.recommended);
    } else if (currentFilter === 'required') {
        models = models.filter(m => m.required);
    }

    if (currentTypeFilter !== 'all') {
        models = models.filter(m => m.type === currentTypeFilter);
    }

    const grid = document.getElementById('model-grid');
    if (models.length === 0) {
        grid.innerHTML = '<p style="color: #94a3b8;">No models found matching filters.</p>';
        return;
    }

    grid.innerHTML = models.map(model => `
        <div class="model-card ${model.installed ? 'installed' : ''}" data-type="${model.type}">
            <div class="model-header">
                <div>
                    <div class="model-name">${model.name}</div>
                    <div>
                        ${model.installed ? '<span class="model-badge badge-installed">✓ Installed</span>' : ''}
                        ${model.required ? '<span class="model-badge badge-required">Required</span>' : ''}
                        ${model.recommended ? '<span class="model-badge badge-recommended">Recommended</span>' : ''}
                    </div>
                </div>
                <span class="model-badge badge-${model.type}">${getTypeIcon(model.type)} ${model.type}</span>
            </div>

            <div class="model-description">${model.description}</div>

            <div class="model-meta">
                <div class="meta-item">
                    Size: <span class="meta-value">${model.size_gb} GB</span>
                </div>
                <div class="meta-item">
                    Quant: <span class="meta-value">${model.quantization}</span>
                </div>
            </div>

            <div class="model-actions">
                ${model.installed ? `
                    <button class="btn btn-success" disabled>✓ Downloaded</button>
                    <a href="${model.download_url}" class="btn btn-secondary" target="_blank">View on HF</a>
                ` : `
                    <button class="btn btn-primary" onclick="downloadModel('${model.id}')">
                        ⏬ Download (${model.size_gb} GB)
                    </button>
                    <a href="${model.download_url}" class="btn btn-secondary" target="_blank">HF</a>
                `}
            </div>

            <div id="progress-${model.id}" class="progress-container" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%"></div>
                </div>
                <div style="font-size: 0.85em; color: #94a3b8; margin-top: 5px;" id="progress-text-${model.id}">
                    Starting download...
                </div>
            </div>
        </div>
    `).join('');
}

function getTypeIcon(type) {
    const icons = {
        'chat': '💬',
        'code': '💻',
        'vision': '👁️',
        'reasoning': '🧠'
    };
    return icons[type] || '📦';
}

async function downloadModel(modelId) {
    try {
        // Show progress bar
        document.getElementById(`progress-${modelId}`).style.display = 'block';

        // Start download
        const response = await fetch(`/v1/models/download/${modelId}`, {
            method: 'POST'
        });
        const result = await response.json();

        if (result.status === 'download_started') {
            // Start polling for progress
            pollDownloadProgress(modelId);
        } else {
            alert(result.message);
            document.getElementById(`progress-${modelId}`).style.display = 'none';
        }
    } catch (error) {
        console.error('Download error:', error);
        alert('Failed to start download: ' + error.message);
    }
}

async function pollDownloadProgress(modelId) {
    const interval = setInterval(async () => {
        try {
            const response = await fetch(`/v1/models/download/${modelId}/status`);
            const status = await response.json();

            const progressBar = document.querySelector(`#progress-${modelId} .progress-fill`);
            const progressText = document.getElementById(`progress-text-${modelId}`);

            if (status.status === 'downloading') {
                const progress = status.progress || 0;
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `Downloading... ${progress.toFixed(1)}%`;
            } else if (status.status === 'completed') {
                progressBar.style.width = '100%';
                progressText.textContent = 'Download complete! Refreshing...';
                clearInterval(interval);
                setTimeout(() => {
                    loadCatalog();  // Reload catalog to show installed models
                }, 2000);
            } else if (status.status === 'failed') {
                progressText.textContent = `Failed: ${status.error}`;
                progressBar.style.background = '#ef4444';
                clearInterval(interval);
            }
        } catch (error) {
            console.error('Progress poll error:', error);
            clearInterval(interval);
        }
    }, 2000);  // Poll every 2 seconds
}

async function checkDownloads() {
    try {
        const response = await fetch('/dashboard/api/downloads');
        const data = await response.json();

        const downloadsSection = document.getElementById('downloads-section');
        const downloadsList = document.getElementById('downloads-list');

        if (Object.keys(data.downloads).length > 0) {
            downloadsSection.style.display = 'block';
            downloadsList.innerHTML = Object.entries(data.downloads).map(([id, status]) => `
                <div class="download-card">
                    <strong>${id}</strong>: ${status.status} - ${(status.progress || 0).toFixed(1)}%
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${status.progress || 0}%"></div>
                    </div>
                </div>
            `).join('');
        } else {
            downloadsSection.style.display = 'none';
        }
    } catch (error) {
        console.error('Failed to check downloads:', error);
    }
}

// Auto-refresh downloads every 5 seconds
setInterval(checkDownloads, 5000);
</script>
