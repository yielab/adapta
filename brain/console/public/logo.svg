<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- dark badge background so the mark reads on light browser tabs -->
  <rect width="64" height="64" rx="16" fill="#0E1117"/>
  <!-- the zero / ring -->
  <circle cx="32" cy="32" r="20" stroke="#6366F1" stroke-width="3"/>
  <!-- three nodes: knowledge (teal) · brand (indigo) · behavior (purple) -->
  <circle cx="32" cy="20" r="3.6" fill="#2DD4BF"/>
  <circle cx="22" cy="40" r="3.6" fill="#6366F1"/>
  <circle cx="42" cy="40" r="3.6" fill="#A855F7"/>
  <!-- connecting lines — the brain's edges -->
  <path d="M32 20 L22 40 M32 20 L42 40 M22 40 L42 40"
        stroke="#6366F1" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
</svg>
