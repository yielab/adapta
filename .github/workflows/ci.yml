name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Fast gate — runs on every push, no infra needed, must be green offline.
  # Runs: check-leaks → lint → coverage (tests + floor) → validate-spec
  # -------------------------------------------------------------------------
  fast:
    name: Fast gate (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: check-leaks
        run: make check-leaks

      - name: lint
        run: make lint

      - name: coverage (tests + 28% floor)
        run: make coverage

      - name: validate-spec
        run: make validate-spec

  # -------------------------------------------------------------------------
  # Full gate — runs on PRs to main only; requires live stack.
  # Runs: migrate-test → boot smoke → contract tests → integration tests
  # -------------------------------------------------------------------------
  full:
    name: Full gate (live stack)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      chroma:
        image: chromadb/chroma:0.6.3
        ports: ["8001:8000"]
        options: >-
          --health-cmd "curl -sf http://localhost:8000/api/v2/heartbeat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      BRAIN_DATABASE_URL: postgresql+asyncpg://brain:brain@localhost:5432/brain
      BRAIN_REDIS_URL: redis://localhost:6379/0
      BRAIN_CHROMA_HOST: localhost
      BRAIN_CHROMA_PORT: "8001"
      BRAIN_SECRET_KEY: ci-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: migrate-test (Pillar 2 — up/down round-trip)
        run: make migrate-test

      - name: Boot smoke test
        run: |
          uvicorn brain.api.app:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # Poll /health until 200 (up to 60s)
          echo "Waiting for /health to return 200..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "  ✓ /health OK after ${i}x2s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "FAIL: server did not become healthy within 60s"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          # Assert it stays up for 15s (not a crash-loop)
          sleep 15
          if ! curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
            echo "FAIL: server stopped responding after 15s"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ Server stable for 15s"

          # /health/deep — all five checks must reach
          curl -fsS http://localhost:8000/health/deep | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print('deep health overall:', d['status'])
          for c in d['checks']:
              print(f'  {c[\"name\"]}: {c[\"status\"]}')
          " || true   # degraded (disk) is acceptable in CI; don't fail on it

          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      - name: Contract tests (Pillar 1 — schemathesis)
        run: |
          TOKEN=$(python - <<'EOF'
          import httpx
          r = httpx.post("http://localhost:8000/v1/auth/register", json={
              "email": "ci@brain.local",
              "password": "ci-password",
              "org_name": "CI Org",
          })
          r.raise_for_status()
          r2 = httpx.post("http://localhost:8000/v1/auth/login", json={
              "email": "ci@brain.local",
              "password": "ci-password",
          })
          r2.raise_for_status()
          print(r2.json()["access_token"])
          EOF
          )
          BRAIN_BEARER_TOKEN="$TOKEN" make test-contracts

      - name: Integration tests
        run: pytest tests/ -v -m integration

      - name: Teardown server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true
