name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  # -------------------------------------------------------------------------
  # Fast gate — runs on every push, no infra needed, must be green offline.
  # Runs: check-leaks → lint → coverage (tests + floor) → validate-spec
  # -------------------------------------------------------------------------
  fast:
    name: Fast gate (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: check-leaks
        run: make check-leaks

      - name: check-chroma (client/server version sync)
        run: make check-chroma

      - name: lint
        run: make lint

      - name: lint-imports (layered-architecture contract)
        run: make lint-imports

      - name: coverage (tests + 30% floor)
        run: make coverage

      - name: validate-spec
        run: make validate-spec

      - name: check-models (generated Pydantic in sync with spec)
        run: make check-models

      - name: import smoke (app + worker boot-import)
        # Catches the boot-killer class of regression — a module eagerly importing
        # a removed setting/symbol — on every push, with no infra. The worker is
        # NOT exercised by the test suite, so this is its only fast guard. Training
        # deps are imported lazily, so this works without the [training] extras.
        run: |
          python -c "import adapta.api.app, adapta.worker.main; print('import OK - app and worker')"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: adapta/console/package-lock.json

      - name: Build operator console (§5.11 C3)
        # Validates the Svelte/TS source compiles clean on every push — a broken
        # build would otherwise only surface at `docker compose build production`.
        working-directory: adapta/console
        run: npm ci --no-audit && npm run build:fast

      - name: Install docs toolchain
        # Build-time-only (docs/requirements.txt), separate from the app deps.
        # The code reference uses static analysis (griffe), so no runtime stack
        # is needed — fast install, no llama-cpp/torch compile.
        run: pip install -r docs/requirements.txt

      - name: Build documentation site (mkdocs --strict)
        # The docs maintenance gate: --strict fails on a broken internal link or
        # a nav entry pointing at a missing file. Produces ./site for deploy.
        run: mkdocs build --strict

      - name: Upload Pages artifact
        # Only on push to main — feeds the deploy-docs job below.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # -------------------------------------------------------------------------
  # Full gate — requires a live stack. Runs on PRs to main AND on direct
  # pushes to main. The latter matters because this repo commits straight to
  # main (no PR), so a PR-only trigger would mean the three SDD contract gates
  # (Pillar 1 contract, Pillar 2 migration, integration) never actually run in
  # CI — only locally. Gating on push-to-main closes that hole.
  # Runs: migrate-test → boot smoke → contract tests → integration tests
  # -------------------------------------------------------------------------
  full:
    name: Full gate (live stack)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))

    services:
      postgres:
        # Pinned in sync with docker-compose.yml (A4.12 image pinning).
        image: postgres:15.17-alpine
        env:
          POSTGRES_USER: adapta
          POSTGRES_PASSWORD: adapta
          POSTGRES_DB: adapta
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        # Pinned in sync with docker-compose.yml (A4.12 image pinning).
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      chroma:
        # MUST match chromadb==1.5.9 in pyproject.toml — version skew → KeyError('_type') on all indexing.
        # The 1.x image ships only the `chroma` binary (no curl/wget/python), so we cannot
        # health-check from inside the container. We expose the port and poll it from the runner
        # in the "Wait for Chroma" step below instead.
        image: chromadb/chroma:1.5.9
        ports: ["8001:8000"]

    env:
      ADAPTA_DATABASE_URL: postgresql+asyncpg://adapta:adapta@localhost:5432/adapta
      ADAPTA_REDIS_URL: redis://localhost:6379/0
      ADAPTA_CHROMA_HOST: localhost
      ADAPTA_CHROMA_PORT: "8001"
      ADAPTA_SECRET_KEY: ci-secret-key-not-for-production
      # Point all data dirs at a writable tmp path — the CI runner has no /app.
      # Subdirs (models, uploads, adapters, datasets) derive automatically from this.
      ADAPTA_DATA_DIR: /tmp/adapta-ci-data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for Chroma to be ready
        # The chroma 1.x image has no shell/python/curl — we can't healthcheck from
        # inside the container. Poll the exposed port from the runner instead.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/api/v2/heartbeat > /dev/null 2>&1; then
              echo "Chroma ready after ${i}x2s"; break
            fi
            [ $i -eq 30 ] && { echo "FAIL: Chroma not ready after 60s"; exit 1; }
            sleep 2
          done

      - name: migrate-test (Pillar 2 — up/down round-trip)
        run: make migrate-test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: adapta/console/package-lock.json

      - name: Build operator console (for StaticFiles mount + smoke)
        working-directory: adapta/console
        run: npm ci --no-audit && npm run build:fast

      - name: Boot smoke test (app + worker)
        run: |
          # --- App: boots and serves ---
          uvicorn adapta.api.app:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          echo "App PID: $SERVER_PID"
          echo "Waiting for /health to return 200..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "  ✓ /health OK after ${i}x2s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "FAIL: app did not become healthy within 60s"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          # --- Worker: boots and stays alive ---
          # `python -m adapta.worker.main` connects to Redis and BLPOP-blocks. A boot
          # regression (import error / removed setting / bad URL) makes it exit
          # immediately with a non-zero code, which this catches. Training deps load
          # lazily per-job, so no GPU/[training] extras are needed just to boot.
          python -m adapta.worker.main &
          WORKER_PID=$!
          echo "Worker PID: $WORKER_PID"

          # Both processes must survive 15s (not crash-looping)
          sleep 15
          if ! kill -0 $WORKER_PID 2>/dev/null; then
            echo "FAIL: worker exited within 15s — boot regression"
            wait $WORKER_PID || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ Worker stable for 15s"

          if ! curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
            echo "FAIL: app stopped responding after 15s"
            kill $SERVER_PID $WORKER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ App stable for 15s"

          # /health/deep — all five service checks must be reachable
          curl -fsS http://localhost:8000/health/deep | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print('deep health overall:', d['status'])
          for c in d['checks']:
              print(f'  {c[\"name\"]}: {c[\"status\"]}')
          " || true   # degraded (disk) is acceptable in CI; don't fail on it

          # Console smoke — /console/ must serve the SPA index.html (§5.11 C3)
          HTTP=$(curl -o /dev/null -sw "%{http_code}" http://localhost:8000/console/)
          if [ "$HTTP" != "200" ]; then
            echo "FAIL: GET /console/ returned $HTTP (expected 200)"
            kill $SERVER_PID $WORKER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ GET /console/ → 200"

          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "WORKER_PID=$WORKER_PID" >> $GITHUB_ENV

      - name: Contract tests (Pillar 1 — schemathesis)
        run: |
          TOKEN=$(python - <<'EOF'
          import httpx
          # NOTE: reserved TLDs (.local/.example/.test) are rejected by email-validator,
          # so use a normal domain for the bootstrap user.
          creds = {"email": "ci@adaptacorp.dev", "password": "ci-password-123"}
          httpx.post("http://localhost:8000/v1/auth/register",
                     json={**creds, "org_name": "CI Org"})
          r2 = httpx.post("http://localhost:8000/v1/auth/login", json=creds)
          r2.raise_for_status()
          print(r2.json()["access_token"])
          EOF
          )
          ADAPTA_BEARER_TOKEN="$TOKEN" make test-contracts

      - name: Integration tests
        run: pytest tests/ -v -m integration

      - name: Teardown app + worker
        if: always()
        run: kill $SERVER_PID $WORKER_PID 2>/dev/null || true

  # -------------------------------------------------------------------------
  # Publish docs to GitHub Pages — push to main only, and only if the fast gate
  # (which builds the site with --strict and uploads it as a Pages artifact)
  # passed. This job just deploys that already-built artifact, so it needs no
  # toolchain install of its own.
  #
  # One-time repo setup: Settings → Pages → Source = "GitHub Actions".
  # -------------------------------------------------------------------------
  deploy-docs:
    name: Publish docs (GitHub Pages)
    runs-on: ubuntu-latest
    needs: fast
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
