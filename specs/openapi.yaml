openapi: 3.1.0
info:
  title: Adapta API
  description: |
    **Your model. Your data. Your servers.**

    Adapta is a self-hosted model-customization platform. Technical teams deploy
    it on their own infrastructure to specialize and serve private language models two ways,
    each behind an OpenAI-compatible API. Your data never leaves your servers.

    **Give it knowledge (RAG)** — upload documents, embed them, and get answers grounded in
    your content, with citations. Weights never change. CPU-only.

    **Change how it behaves (fine-tuning / LoRA)** — train a QLoRA adapter on instruction
    data; the adapter only serves once it passes the eval gate (score ≥ 0.6 or a clear
    improvement over the base model). Requires a GPU.

    **Composed endpoints** — a single project endpoint can serve both: retrieved context
    with citations (RAG) and trained tone/format (the LoRA adapter) in one call.

    ---

    **Auth:** management endpoints require a JWT Bearer token from `POST /v1/auth/login`.
    The `POST /v1/chat/completions` endpoint uses a scoped project API key (`adp_*` prefix).

  version: 0.1.0
  license:
    name: MIT
    url: https://github.com/yielab/adapta/blob/main/LICENSE
  contact:
    name: Adapta
    url: https://github.com/yielab/adapta
  x-logo:
    url: /console/logo.svg
    altText: Adapta

servers:
  - url: /v1
    description: Versioned API

tags:
  - name: auth
    description: Login, register, current user
  - name: projects
    description: Project lifecycle (rag | finetune)
  - name: files
    description: Document upload + indexing (knowledge for RAG answers and/or dataset synthesis)
  - name: datasets
    description: JSONL dataset upload + validation (finetune projects)
  - name: jobs
    description: Training job lifecycle (finetune projects)
  - name: endpoints
    description: Create and retrieve the servable endpoint for a project
  - name: keys
    description: Scoped API key management
  - name: chat
    description: OpenAI-compatible serving
  - name: settings
    description: DB-backed whitelisted org-scoped runtime settings

paths:
  # ──────────────────────────────────────────────────────────────────────────
  # Auth
  # ──────────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an organization + its admin user (open registration)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '422': {$ref: '#/components/responses/Error'}
        '201': {description: User created, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Obtain JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Token, content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current authenticated user
      security: [{BearerAuth: []}]
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        '401': {$ref: '#/components/responses/Error'}

  /auth/invite:
    post:
      operationId: createInvite
      tags: [auth]
      summary: Invite a user to a team (admin only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteRequest'}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '201': {description: Invitation (token shown once), content: {application/json: {schema: {$ref: '#/components/schemas/InvitationResponse'}}}}

  /auth/accept-invite:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Redeem an invite token and set a password
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptInviteRequest'}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '201': {description: User created/joined, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        '429': {$ref: '#/components/responses/Error'}

  /auth/invitations:
    get:
      operationId: listInvitations
      tags: [auth]
      summary: List a team's invitations (admin only)
      security: [{BearerAuth: []}]
      parameters:
        - name: team_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Invitations, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InvitationResponse'}}}}}

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password (verifies current password first)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: Password changed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}

  # ──────────────────────────────────────────────────────────────────────────
  # Teams
  # ──────────────────────────────────────────────────────────────────────────
  /teams/{team_id}/members:
    get:
      operationId: listTeamMembers
      tags: [auth]
      summary: List members of a team (any team member may read)
      security: [{BearerAuth: []}]
      parameters:
        - name: team_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '200': {description: Members, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MemberResponse'}}}}}

  # ──────────────────────────────────────────────────────────────────────────
  # Projects
  # ──────────────────────────────────────────────────────────────────────────
  /models:
    get:
      operationId: listBaseModels
      tags: [models]
      summary: List the base-model catalog
      description: >
        The single catalog (A3.3) every project's base_model validates against —
        one entry per servable+trainable base, with its modality (text or
        vision). Feeds the console's base-model dropdown and modality-aware UI.
      security: [{BearerAuth: []}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200':
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BaseModelInfo'}

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects for a team
      security: [{BearerAuth: []}]
      parameters:
        - name: team_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Projects, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProjectResponse'}}}}}

    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectResponse'}}}}

  /projects/{project_id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Project, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectResponse'}}}}
        '404': {$ref: '#/components/responses/Error'}

    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project (admin only)
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '204': {description: Deleted}

  # ──────────────────────────────────────────────────────────────────────────
  # Files (RAG)
  # ──────────────────────────────────────────────────────────────────────────
  /projects/{project_id}/files:
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload a document for indexing (both project types)
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
              required: [file]
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '202': {description: Accepted — indexing in background}

    get:
      operationId: listFiles
      tags: [files]
      summary: List uploaded files for a project
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Files, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/FileResponse'}}}}}

  /projects/{project_id}/files/{file_id}:
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file and remove its chunks from the collection
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {name: file_id, in: path, required: true, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '204': {description: Deleted}

  # ──────────────────────────────────────────────────────────────────────────
  # Datasets (fine-tune)
  # ──────────────────────────────────────────────────────────────────────────
  /projects/{project_id}/datasets:
    post:
      operationId: uploadDataset
      tags: [datasets]
      summary: Upload a training dataset (finetune projects) — .jsonl, or a .zip image bundle
      description: |
        Plain `.jsonl` for text datasets. For image datasets (§V), a `.zip`
        bundle holding exactly one root `.jsonl` manifest plus the images its
        rows reference (`images` paths relative to the bundle; png/jpg/jpeg/webp).
        Validation runs in the background; poll the dataset until `valid`/`invalid`.
        Bundles are extracted with traversal protection and size/count caps.
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
              required: [file]
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '202': {description: Accepted — validation in background}

    get:
      operationId: listDatasets
      tags: [datasets]
      summary: List datasets for a project
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Datasets, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DatasetResponse'}}}}}

  /projects/{project_id}/datasets/{dataset_id}:
    get:
      operationId: getDataset
      tags: [datasets]
      summary: Get dataset status
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {name: dataset_id, in: path, required: true, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Dataset, content: {application/json: {schema: {$ref: '#/components/schemas/DatasetResponse'}}}}

  # ──────────────────────────────────────────────────────────────────────────
  # Training jobs
  # ──────────────────────────────────────────────────────────────────────────
  /projects/{project_id}/jobs:
    post:
      operationId: createJob
      tags: [jobs]
      summary: Enqueue a training job
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobCreateRequest'}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}

    get:
      operationId: listJobs
      tags: [jobs]
      summary: List training jobs for a project
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Jobs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/JobResponse'}}}}}

  /projects/{project_id}/jobs/{job_id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job status and live progress
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {name: job_id, in: path, required: true, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Job, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}

  # ──────────────────────────────────────────────────────────────────────────
  # Endpoint
  # ──────────────────────────────────────────────────────────────────────────
  /projects/{project_id}/endpoint:
    post:
      operationId: createEndpoint
      tags: [endpoints]
      summary: Activate the project endpoint (RAG must have indexed docs; finetune must have passed eval gate)
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '201': {description: Endpoint created, content: {application/json: {schema: {$ref: '#/components/schemas/EndpointResponse'}}}}
        '422': {$ref: '#/components/responses/Error'}

    get:
      operationId: getEndpoint
      tags: [endpoints]
      summary: Get project endpoint
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Endpoint, content: {application/json: {schema: {$ref: '#/components/schemas/EndpointResponse'}}}}

  # ──────────────────────────────────────────────────────────────────────────
  # Usage metering
  # ──────────────────────────────────────────────────────────────────────────
  /projects/{project_id}/usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: Daily token-usage rollup for the project's endpoint
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Usage, content: {application/json: {schema: {$ref: '#/components/schemas/UsageResponse'}}}}

  # ──────────────────────────────────────────────────────────────────────────
  # Platform settings (DB-backed, whitelisted, org-scoped overrides)
  # ──────────────────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: List whitelisted settings with their effective value and provenance
      security: [{BearerAuth: []}]
      parameters:
        - name: team_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Settings, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SettingResponse'}}}}}

    put:
      operationId: putSetting
      tags: [settings]
      summary: Override a whitelisted setting (admin only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SettingWriteRequest'}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Setting written, content: {application/json: {schema: {$ref: '#/components/schemas/SettingWriteResult'}}}}

  /settings/{key}:
    delete:
      operationId: deleteSetting
      tags: [settings]
      summary: Reset a setting to its default by removing the override (admin only)
      security: [{BearerAuth: []}]
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: team_id, in: query, required: true, schema: {type: string}}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '204': {description: Reset to default}

  # ──────────────────────────────────────────────────────────────────────────
  # API keys
  # ──────────────────────────────────────────────────────────────────────────
  /projects/{project_id}/keys:
    post:
      operationId: createKey
      tags: [keys]
      summary: Create a scoped API key for the project endpoint
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KeyCreateRequest'}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '201': {description: Key (shown once), content: {application/json: {schema: {$ref: '#/components/schemas/KeyCreatedResponse'}}}}

    get:
      operationId: listKeys
      tags: [keys]
      summary: List API keys (prefix only — full key never returned after creation)
      security: [{BearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200': {description: Keys, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/KeyResponse'}}}}}

  /projects/{project_id}/keys/{key_id}:
    delete:
      operationId: revokeKey
      tags: [keys]
      summary: Revoke a key
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {name: key_id, in: path, required: true, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '204': {description: Revoked}

  # ──────────────────────────────────────────────────────────────────────────
  # Dataset synthesis (finetune projects only)
  # ──────────────────────────────────────────────────────────────────────────
  /projects/{project_id}/datasets/synthesize:
    post:
      operationId: synthesizeDataset
      tags: [datasets]
      summary: Synthesize an instruction dataset from indexed documents
      description: |
        Kicks off a background job that reads the project's ChromaDB collection,
        calls the local inference engine to generate question/answer pairs, and
        writes a validated JSONL dataset. Poll the returned dataset_id via
        GET /v1/projects/{project_id}/datasets/{dataset_id} for status.
        Only available for `finetune` projects that already have indexed files.
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SynthesizeRequest'}
      responses:
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '202': {description: Synthesis started, content: {application/json: {schema: {$ref: '#/components/schemas/SynthesizeResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  # ──────────────────────────────────────────────────────────────────────────
  # Chat (OpenAI-compatible, scoped key auth)
  # ──────────────────────────────────────────────────────────────────────────
  /chat/completions:
    post:
      operationId: createChatCompletion
      tags: [chat]
      summary: OpenAI-compatible chat completion
      description: |
        Authenticate with a scoped project API key (Authorization: Bearer adp_...).
        The `model` field is the endpoint slug.
        Serving composes the project's artifacts: if the project has indexed
        documents, retrieved context is injected and `citations` returned; if the
        endpoint has a trained adapter (fine-tune), it is applied. A fine-tune
        project with indexed documents gets both — knowledge from its documents,
        behavior from its adapter.

        **Images (vision endpoints, §V):** `messages[].content` also accepts the
        OpenAI content-parts array with `image_url` parts. Images must be inline
        `data:image/...;base64,` URLs (remote http(s) URLs are rejected — the
        server never fetches external content). Image parts are accepted only on
        endpoints whose base model is a vision model; on a text endpoint they are
        rejected with 400. In v1, requests carrying images are non-streaming
        (`stream` must be false) and skip document retrieval (no RAG composition
        with image input yet).
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatCompletionRequest'}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '200':
          description: Chat completion or SSE stream
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatCompletionResponse'}
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Error'}

# ──────────────────────────────────────────────────────────────────────────
# Components
# ──────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: Scoped project API key (adp_...)

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string}

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}

  schemas:
    # ──────────────────────────────────────────────────────────────────────
    # Named enums — extracted to components so the generated Pydantic models
    # carry meaningful names (e.g. JobStatus, not Status1) instead of the
    # auto-numbered junk datamodel-codegen emits for inline enums.
    # ──────────────────────────────────────────────────────────────────────
    Role:
      type: string
      enum: [admin, member, viewer]
    ProjectType:
      type: string
      enum: [rag, finetune]
    Modality:
      type: string
      enum: [text, vision]
    Gate:
      type: string
      enum: [absolute, improvement]
    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    EndpointStatus:
      type: string
      enum: [pending, active, disabled]
    MessageRole:
      type: string
      enum: [system, user, assistant]

    # Auth
    RegisterRequest:
      type: object
      required: [org_name, email, password]
      properties:
        # "non-blank" and "password >= 8 chars" are DOMAIN rules: the handler
        # raises InvalidRequest (400 invalid_request, with a friendly message),
        # which is the product's contract (test_register_short_password_is_400).
        # They are intentionally NOT schema constraints (minLength/pattern), since
        # those would pre-empt the handler with a structural 422. maxLength stays
        # a schema cap — it mirrors the DB column size and prevents a 500 overflow.
        org_name: {type: string, maxLength: 128, description: "Must not be blank (handler → 400)."}
        email: {type: string, format: email, maxLength: 256}
        password: {type: string, description: "Minimum 8 characters (handler → 400 invalid_request)."}

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}

    # Response schemas list every field they always carry in `required`, so the
    # generated models are strict (non-Optional) — the routers construct every
    # field, including the nullable ones. Datetime fields are typed as plain
    # `string` (the handlers emit `.isoformat()` strings), avoiding the
    # aware/naive parsing pitfall a `format: date-time` (AwareDatetime) model
    # would hit on response serialization.
    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: {type: string}
        token_type: {type: string, default: bearer}

    UserResponse:
      type: object
      required: [id, email, org_id, teams]
      properties:
        id: {type: string}
        email: {type: string}
        org_id: {type: string}
        teams:
          type: array
          description: Teams the user belongs to, with their role in each. Lets a client discover the team_id required by the project endpoints.
          items:
            $ref: '#/components/schemas/TeamSummary'
    TeamSummary:
      type: object
      required: [id, name, role]
      properties:
        id: {type: string}
        name: {type: string}
        role: {$ref: '#/components/schemas/Role'}

    # Invitations
    InviteRequest:
      type: object
      required: [email, team_id]
      properties:
        email: {type: string, format: email, maxLength: 255}
        team_id: {type: string}
        # Optional on the wire; the handler defaults a missing role to `member`
        # (a $ref + default trips codegen's enum-default mypy bug, so the
        # default lives in code, not the schema).
        role: {$ref: '#/components/schemas/Role'}
    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 1}
        # Domain rule (handler → 400), not a schema 422 — see RegisterRequest.
        password: {type: string, description: "Minimum 8 characters (handler → 400 invalid_request)."}
    InvitationResponse:
      type: object
      required: [id, email, team_id, role, status, token, expires_at]
      properties:
        id: {type: string}
        email: {type: string}
        team_id: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        status: {$ref: '#/components/schemas/InvitationStatus'}
        token: {type: string, nullable: true}
        expires_at: {type: string}

    MemberResponse:
      type: object
      required: [user_id, email, role, joined_at]
      properties:
        user_id: {type: string}
        email: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        joined_at: {type: string}

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string}
        # Domain rule (handler → 400), not a schema 422 — see RegisterRequest.
        new_password: {type: string, description: "Minimum 8 characters (handler → 400 invalid_request)."}

    # Projects
    ProjectCreate:
      type: object
      required: [name, type, base_model, team_id]
      properties:
        # maxLength mirrors projects.name String(128) — see RegisterRequest note.
        name: {type: string, minLength: 1, maxLength: 128}
        type: {$ref: '#/components/schemas/ProjectType'}
        base_model: {type: string}
        description: {type: string, nullable: true}
        team_id: {type: string}

    ProjectResponse:
      type: object
      required: [id, name, type, status, base_model, description, team_id, created_at, summary]
      properties:
        id: {type: string}
        name: {type: string}
        type: {$ref: '#/components/schemas/ProjectType'}
        status: {type: string}
        base_model: {type: string}
        description: {type: string, nullable: true}
        team_id: {type: string}
        created_at: {type: string}
        # Dashboard read-model (§C2.1) — null on create, populated on list/get.
        summary: {$ref: '#/components/schemas/ProjectSummary', nullable: true}

    # Project dashboard read-model (computed aggregate served with each project).
    FileSummary:
      type: object
      required: [total, indexed, chunks]
      properties:
        total: {type: integer}
        indexed: {type: integer}
        chunks: {type: integer}
    DatasetSummary:
      type: object
      required: [total, valid]
      properties:
        total: {type: integer}
        valid: {type: integer}
    JobSummary:
      type: object
      required: [total, running]
      properties:
        total: {type: integer}
        running: {type: integer}
        last_status: {type: string, nullable: true}
        last_eval_score: {type: number, nullable: true}
        gate_passed: {type: boolean, nullable: true}
    EndpointSummary:
      type: object
      required: [exists]
      properties:
        exists: {type: boolean}
        slug: {type: string, nullable: true}
        status: {type: string, nullable: true}
    UsageSummary:
      type: object
      required: [requests, total_tokens]
      properties:
        requests: {type: integer}
        total_tokens: {type: integer}
    ProjectSummary:
      type: object
      required: [stage, files, datasets, jobs, endpoint, keys_active, usage_7d]
      properties:
        stage: {type: string}
        files: {$ref: '#/components/schemas/FileSummary'}
        datasets: {$ref: '#/components/schemas/DatasetSummary'}
        jobs: {$ref: '#/components/schemas/JobSummary'}
        endpoint: {$ref: '#/components/schemas/EndpointSummary'}
        keys_active: {type: integer}
        usage_7d: {$ref: '#/components/schemas/UsageSummary'}
        last_activity_at: {type: string, nullable: true}

    # Files
    FileResponse:
      type: object
      required: [id, filename, status, num_chunks, size_bytes, uploaded_at]
      properties:
        id: {type: string}
        filename: {type: string}
        status: {type: string}
        num_chunks: {type: integer, nullable: true}
        size_bytes: {type: integer}
        uploaded_at: {type: string}

    # Datasets
    DatasetResponse:
      type: object
      required: [id, name, status, num_samples, modality, num_images, validation_error, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string}
        num_samples: {type: integer, nullable: true}
        # §V image datasets: "vision" once an image bundle validates; "text" otherwise.
        modality: {$ref: '#/components/schemas/Modality'}
        num_images: {type: integer, nullable: true}
        validation_error: {type: string, nullable: true}
        created_at: {type: string}

    # Jobs
    TrainingConfigInput:
      # Bounds mirror the server's enqueue-time validation (A4.12,
      # adapta/services/training.py _HYPERPARAM_BOUNDS) — out-of-range
      # values are rejected with 422 before a job is created.
      type: object
      properties:
        num_epochs: {type: integer, default: 3, minimum: 1, maximum: 100}
        batch_size: {type: integer, default: 4, minimum: 1, maximum: 128}
        learning_rate: {type: number, default: 0.0002, minimum: 1.0e-6, maximum: 0.1}
        lora_r: {type: integer, default: 16, minimum: 1, maximum: 256}
        lora_alpha: {type: integer, default: 32, minimum: 1, maximum: 512}
        lora_dropout: {type: number, default: 0.1, minimum: 0.0, maximum: 0.9}
        max_seq_length: {type: integer, default: 512, minimum: 16, maximum: 8192}
        # DPO-specific: KL-divergence regularisation coefficient (β). Higher β
        # keeps the fine-tuned model closer to the reference (base) distribution;
        # lower β allows stronger preference learning. Only used when method=dpo.
        dpo_beta: {type: number, default: 0.1, minimum: 0.0, maximum: 1.0}

    JobCreateRequest:
      type: object
      required: [dataset_id]
      properties:
        dataset_id: {type: string}
        # Training algorithm. Omit or pass null for the default (sft). Supported values:
        #   "sft" — supervised instruction tuning (prompt/response rows)
        #   "dpo" — Direct Preference Optimisation (prompt/chosen/rejected rows)
        method:
          type: string
          enum: [sft, dpo]
          nullable: true
        training_config: {$ref: '#/components/schemas/TrainingConfigInput', nullable: true}

    JobResponse:
      type: object
      required: [id, status, progress, logs, adapter_path, eval_score, eval_passed, eval_metrics, error_message, created_at]
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/JobStatus'}
        progress: {type: number, minimum: 0, maximum: 1}
        logs: {type: string, nullable: true}
        adapter_path: {type: string, nullable: true}
        eval_score: {type: number, nullable: true}
        eval_passed: {type: boolean, nullable: true}
        # Full eval result for an auditable gate verdict (A4.6): score, base_score,
        # score_delta, held_out, metrics, sample_predictions. Null until evaluation.
        eval_metrics: {type: object, nullable: true, additionalProperties: true}
        error_message: {type: string, nullable: true}
        created_at: {type: string}

    # Endpoint
    AdapterProvenance:
      type: object
      description: Adapter eval evidence (null for RAG-only endpoints)
      required: [job_id, eval_score, gate]
      properties:
        job_id: {type: string}
        eval_score: {type: number, format: float}
        base_score: {type: number, format: float, nullable: true}
        score_delta: {type: number, format: float, nullable: true}
        gate: {$ref: '#/components/schemas/Gate'}

    RetrievalSummary:
      type: object
      description: RAG retrieval layer (null when no documents are indexed)
      required: [indexed_chunks]
      properties:
        indexed_chunks: {type: integer}

    EndpointResponse:
      type: object
      required: [id, slug, status, base_model, modality, project_type, created_at, adapter, retrieval, adapter_path]
      properties:
        id: {type: string}
        slug: {type: string}
        status: {$ref: '#/components/schemas/EndpointStatus'}
        base_model: {type: string}
        modality: {$ref: '#/components/schemas/Modality'}
        project_type: {$ref: '#/components/schemas/ProjectType'}
        created_at: {type: string}
        adapter: {$ref: '#/components/schemas/AdapterProvenance', nullable: true}
        retrieval: {$ref: '#/components/schemas/RetrievalSummary', nullable: true}
        adapter_path: {type: string, nullable: true, deprecated: true}

    # Usage
    UsageDay:
      type: object
      required: [day, prompt_tokens, completion_tokens, total_tokens, request_count]
      properties:
        day: {type: string}
        prompt_tokens: {type: integer}
        completion_tokens: {type: integer}
        total_tokens: {type: integer}
        request_count: {type: integer}
    UsageResponse:
      type: object
      required: [project_id, total_prompt_tokens, total_completion_tokens, total_tokens, total_requests, days]
      properties:
        project_id: {type: string}
        total_prompt_tokens: {type: integer}
        total_completion_tokens: {type: integer}
        total_tokens: {type: integer}
        total_requests: {type: integer}
        days: {type: array, items: {$ref: '#/components/schemas/UsageDay'}}

    # Keys
    KeyCreateRequest:
      type: object
      required: [name]
      properties:
        # maxLength mirrors api_keys.name String(128) — see RegisterRequest note.
        name: {type: string, minLength: 1, maxLength: 128}

    KeyCreatedResponse:
      type: object
      required: [id, name, key, prefix]
      properties:
        id: {type: string}
        name: {type: string}
        key: {type: string, description: "Full key — shown once only"}
        prefix: {type: string}

    KeyResponse:
      type: object
      required: [id, name, prefix, is_active, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        prefix: {type: string}
        is_active: {type: boolean}
        created_at: {type: string}

    # Synthesis
    SynthesizeRequest:
      type: object
      properties:
        n_pairs_per_chunk: {type: integer, minimum: 1, maximum: 10, default: 3}
        max_chunks: {type: integer, minimum: 1, maximum: 500, default: 50}
        system_prompt: {type: string, nullable: true, maxLength: 1000}
        base_model: {type: string, nullable: true}

    SynthesizeResponse:
      type: object
      required: [dataset_id, status, message]
      properties:
        dataset_id: {type: string}
        status: {type: string}
        message: {type: string}

    # Settings (DB-backed whitelisted org-scoped overrides). `value`/`default`/
    # `min`/`max` are left untyped because a setting is int OR float depending on
    # its key; an untyped schema preserves the original int (a `number` type
    # would coerce 512 → 512.0 on the way out).
    SettingResponse:
      type: object
      required: [key, label, group, value, source, default, min, max, description]
      properties:
        key: {type: string}
        label: {type: string}
        group: {type: string}
        value: {}
        source: {type: string}
        default: {}
        min: {}
        max: {}
        description: {type: string}
    SettingWriteRequest:
      type: object
      required: [team_id, key, value]
      properties:
        team_id: {type: string}
        key: {type: string}
        value: {}
    SettingWriteResult:
      type: object
      required: [key, value, source, default]
      properties:
        key: {type: string}
        value: {}
        source: {type: string}
        default: {}

    # Models catalog
    BaseModelInfo:
      type: object
      required: [name, modality, model_type, use_case, best_for, available, hf_repo_id, notes]
      properties:
        name: {type: string, description: "Catalog name — the value Project.base_model takes"}
        modality: {$ref: '#/components/schemas/Modality'}
        model_type: {type: string}
        description: {type: string, nullable: true}
        use_case: {type: string}
        best_for: {type: array, items: {type: string}}
        available: {type: boolean}
        train_vram_gb: {type: integer, nullable: true}
        serve_ram_gb: {type: integer, nullable: true}
        hf_repo_id: {type: string}
        notes: {type: string}

    # Chat
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: {type: string, description: "Endpoint slug"}
        messages: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
        temperature: {type: number, minimum: 0, maximum: 2, nullable: true}
        max_tokens: {type: integer, nullable: true}
        top_p: {type: number, minimum: 0, maximum: 1, nullable: true}
        stream: {type: boolean, default: false}

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: {$ref: '#/components/schemas/MessageRole'}
        content:
          description: >
            Plain text, or an OpenAI content-parts array (text and/or
            image_url parts; images as data: URLs, vision endpoints only).
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ChatContentParts'

    ChatContentParts:
      type: array
      maxItems: 16
      items: {$ref: '#/components/schemas/ChatContentPart'}

    ChatContentPart:
      description: One OpenAI-style message content part.
      oneOf:
        - $ref: '#/components/schemas/TextContentPart'
        - $ref: '#/components/schemas/ImageContentPart'

    TextContentPart:
      type: object
      required: [type, text]
      additionalProperties: false
      properties:
        type: {type: string, enum: [text]}
        text: {type: string}

    ImageContentPart:
      type: object
      required: [type, image_url]
      additionalProperties: false
      properties:
        type: {type: string, enum: [image_url]}
        image_url: {$ref: '#/components/schemas/ImageUrl'}

    ImageUrl:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          description: "Inline image as a data:image/...;base64, URL (remote URLs rejected)"

    ChatResponseMessage:
      type: object
      properties:
        role: {type: string}
        content: {type: string}
    ChatChoice:
      type: object
      properties:
        index: {type: integer}
        message: {$ref: '#/components/schemas/ChatResponseMessage'}
        finish_reason: {type: string}
    ChatUsage:
      type: object
      properties:
        prompt_tokens: {type: integer}
        completion_tokens: {type: integer}
        total_tokens: {type: integer}
    Citation:
      type: object
      properties:
        index: {type: integer}
        source: {type: string}
        score: {type: number}
    ChatCompletionResponse:
      # Response-only (the OpenAI-passthrough dict is validated against this by
      # schemathesis, not constructed from this model), so fields stay optional.
      type: object
      properties:
        id: {type: string}
        object: {type: string}
        created: {type: integer}
        model: {type: string}
        choices: {type: array, items: {$ref: '#/components/schemas/ChatChoice'}}
        usage: {$ref: '#/components/schemas/ChatUsage'}
        citations:
          type: array
          nullable: true
          description: "Document citations — present when the project has indexed documents"
          items: {$ref: '#/components/schemas/Citation'}

    # Error
    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        correlation_id: {type: string, nullable: true}
    ErrorResponse:
      type: object
      properties:
        error: {$ref: '#/components/schemas/Error'}
