# OpenClaw Provider Configuration for Brain From Cero
# Save this to: ~/.openclaw/providers/brain-local.yaml

id: brain-local
name: Brain From Cero (Local)
type: openai  # Use OpenAI-compatible interface
baseUrl: http://localhost:8000/v1

# Optional: Enable if you configure API key authentication
# apiKey: your-api-key-here

models:
  # === CHAT MODELS ===

  - id: qwen2.5-3b-instruct
    name: Qwen 2.5 3B Instruct (Local)
    description: Fast, efficient general-purpose chat model
    contextWindow: 32768
    maxTokens: 4096
    inputCost: 0   # Free since it's local!
    outputCost: 0
    supportsTools: false
    supportsVision: false
    recommended: true  # Recommended for most tasks

  - id: qwen2.5-7b-instruct
    name: Qwen 2.5 7B Instruct (Local)
    description: Advanced reasoning and complex tasks
    contextWindow: 32768
    maxTokens: 4096
    inputCost: 0
    outputCost: 0
    supportsTools: false
    supportsVision: false

  # === CODE MODELS ===

  - id: qwen2.5-coder-3b
    name: Qwen 2.5 Coder 3B (Local)
    description: Specialized for code generation and review
    contextWindow: 32768
    maxTokens: 4096
    inputCost: 0
    outputCost: 0
    supportsTools: false
    supportsVision: false

  # === VISION MODELS ===

  - id: moondream2
    name: Moondream2 (Local Vision)
    description: Image analysis and understanding
    contextWindow: 2048
    maxTokens: 512
    inputCost: 0
    outputCost: 0
    supportsTools: false
    supportsVision: true

