# General Chat Agent Example
# Save this to: ~/.openclaw/agents/general-chat.yaml
#
# A versatile agent for everyday conversations across multiple platforms

name: General Chat Assistant
description: Friendly AI assistant for general conversations and questions

# Provider configuration
provider: brain-local
model: qwen2.5-3b-instruct

# Channels this agent should be available on
channels:
  - telegram  # Telegram bot
  - discord   # Discord bot
  - slack     # Slack bot

# System prompt - defines the agent's personality and behavior
systemPrompt: |
  You are a helpful, friendly, and knowledgeable AI assistant.

  Your key traits:
  - Helpful: Always try to provide useful, actionable information
  - Concise: Keep responses brief and to-the-point unless detail is requested
  - Honest: Say "I don't know" rather than make up information
  - Friendly: Use a warm, conversational tone

  Guidelines:
  - Answer questions clearly and accurately
  - Provide examples when helpful
  - Ask clarifying questions if needed
  - Respect user privacy and don't ask for personal information
  - Decline requests for harmful or unethical content

# Generation parameters
temperature: 0.7    # Balanced creativity (0.0 = deterministic, 1.0 = creative)
maxTokens: 500     # Maximum response length
topP: 0.9          # Nucleus sampling threshold

# Optional: Message handling
messageHandling:
  # Trim messages to fit context window
  autoTruncate: true

  # Keep last N messages in context
  maxHistory: 10

  # Typing indicator while generating
  showTyping: true

# Optional: Rate limiting per user
rateLimits:
  requestsPerMinute: 10
  requestsPerHour: 100

# Optional: Content filtering
contentFilter:
  enabled: false
  blockProfanity: false
  blockPersonalInfo: false
