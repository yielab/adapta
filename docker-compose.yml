# Adapta — local stack. One way to run it: `docker compose up -d --build`
# (or `make up`). The repo is bind-mounted into app and worker, so host edits are
# live (uvicorn hot-reloads); the toolchain is baked into the app image, so
# `docker compose exec app make ci` works with zero setup.
#
# Everything runs on CPU; no GPU or NVIDIA Container Toolkit is needed.

# Pin the compose project name so image/volume/network prefixes are stable
# (`adapta_*`) regardless of the checkout directory name.
name: adapta

# Shared log-rotation policy — keeps container logs from growing unbounded (§4.4).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ──────────────────────────────────────────────
  # Main application: control plane + RAG serving
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    # One image for app and worker (E4.1): without an explicit name compose builds a
    # second `adapta-worker` image, and `build app` alone leaves the worker stale.
    image: adapta-app:latest
    container_name: adapta-app
    # F1.6: the entrypoint exits non-zero when the server stops answering /health (OOM kill,
    # crash); without a restart policy that exit would leave the API down.
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Live source: host edits restart the server (ADAPTA_RELOAD). /app/data
      # rides along — uploads/models/adapters/datasets live in ./data on the host.
      - .:/app
    environment:
      - ADAPTA_DATABASE_URL=postgresql+asyncpg://adapta:${POSTGRES_PASSWORD:-adapta}@postgres:5432/adapta
      - ADAPTA_REDIS_URL=redis://redis:6379/0
      - ADAPTA_SECRET_KEY=${ADAPTA_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_use_openssl_rand_hex_32}
      - ADAPTA_RELOAD=1
      # Seed a default admin (admin@example.com / admin12345) on an empty DB so
      # the console works on first boot. Set 0 to use the register flow instead.
      - ADAPTA_SEED_DEFAULT_ADMIN=${ADAPTA_SEED_DEFAULT_ADMIN:-1}
      - ADAPTA_N_GPU_LAYERS=${ADAPTA_N_GPU_LAYERS:-0}
      - ADAPTA_N_THREADS=${ADAPTA_N_THREADS:-8}
      # Max distinct models the serving cache keeps resident (LRU-evicted past this).
      # Default 2; drop to 1 on low-RAM hosts that serve several large fine-tunes (each
      # 3B GGUF is ~2 GB in CPU RAM, so several at once can exhaust the box).
      - ADAPTA_MAX_LOADED_MODELS=${ADAPTA_MAX_LOADED_MODELS:-2}
      # Memory budget (MiB) for resident models; 0 = auto from this container's memory limit
      # minus a 1 GiB reserve for the embedder/runtime. Loading evicts LRU to fit; a model that
      # can never fit is refused with a typed 503 instead of being OOM-killed (OPERATIONS 6.1).
      - ADAPTA_MODEL_MEMORY_BUDGET_MB=${ADAPTA_MODEL_MEMORY_BUDGET_MB:-0}
      # "ollama" routes adapter-less text requests to the optional `ollama` profile
      # service (OPERATIONS §9); adapters and vision stay on llama-cpp.
      - ADAPTA_SERVING_BACKEND=${ADAPTA_SERVING_BACKEND:-llamacpp}
    deploy:
      resources:
        limits:
          memory: 4g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - adapta-network

  # ──────────────────────────────────────────────
  # Background worker: consumes the Redis job queue (same image as app).
  # ENTRYPOINT is replaced so it skips the app's migrate-then-uvicorn script.
  # ──────────────────────────────────────────────
  worker:
    image: adapta-app:latest  # the app image; `make up` builds it once via the app service
    pull_policy: never
    container_name: adapta-worker
    entrypoint: ["python", "-m", "adapta.worker.main"]
    volumes:
      - .:/app  # live source for worker code too
    environment:
      - ADAPTA_DATABASE_URL=postgresql+asyncpg://adapta:${POSTGRES_PASSWORD:-adapta}@postgres:5432/adapta
      - ADAPTA_REDIS_URL=redis://redis:6379/0
      - ADAPTA_SECRET_KEY=${ADAPTA_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_use_openssl_rand_hex_32}
    # Graceful shutdown: the worker requeues its in-flight job on SIGTERM, so give
    # it time to cancel cleanly before Docker SIGKILLs it (§4.4).
    stop_grace_period: 60s
    healthcheck:
      # A silently dead/hung worker still looks `Up`; the heartbeat key it refreshes
      # in Redis expires if it stops looping, flipping this red (§4.4).
      test: ["CMD", "python", "-m", "adapta.worker.main", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8g
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - adapta-network

  # ──────────────────────────────────────────────
  # PostgreSQL: metadata store
  # ──────────────────────────────────────────────
  postgres:
    # Pinned to a specific minor for reproducible installs (A4.12);
    # patch upgrades within 15.x are data-compatible.
    image: postgres:15.17-alpine
    container_name: adapta-postgres
    environment:
      POSTGRES_USER: adapta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adapta}
      POSTGRES_DB: adapta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # published for local debugging (psql from the host)
    networks:
      - adapta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapta"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────────
  # Redis: job queue
  # ──────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine  # pinned minor for reproducible installs (A4.12)
    container_name: adapta-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"  # published for local debugging (redis-cli from the host)
    networks:
      - adapta-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────────
  # ChromaDB: per-project vector collections (RAG)
  # Pinned version — update in sync with adapta/services/rag.py client usage.
  # ──────────────────────────────────────────────
  chroma:
    # Pinned in sync with the chromadb client in pyproject.toml — a client/server
    # API skew (e.g. 1.x client vs 0.6.x server) breaks collection creation with
    # KeyError('_type'). Keep these two versions equal.
    image: chromadb/chroma:1.5.9
    container_name: adapta-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/data
    ports:
      - "8001:8000"  # published for local debugging (Chroma API from the host)
    networks:
      - adapta-network
    # Healthcheck (E1.15): the 1.5.9 image has no curl/wget/python but does ship bash, so
    # probe /api/v2/heartbeat over bash's /dev/tcp (needs a 200 within 5 s). `$$` is compose
    # escaping for a literal `$`. A deadlocked or paused Chroma turns this `unhealthy`.
    # Dependents still gate on `service_started`; the app and worker connect lazily and
    # bound every request with ADAPTA_CHROMA_TIMEOUT_SECONDS.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -t 5 -r l <&3 && [[ $$l == *\" 200 \"* ]]"
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ──────────────────────────────────────────────
  # Observability (optional) — `docker compose --profile observability up -d`.
  # Off by default; scrapes the app's /metrics (§3.5).
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: adapta-prometheus
    profiles: [observability]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - adapta-network
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: adapta-grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - adapta-network
    logging: *default-logging

  # ──────────────────────────────────────────────
  # Ollama (optional, E2.1) — `docker compose --profile ollama up -d`.
  # CPU by default (an operator with a GPU adds `devices` in their own override).
  # Models live in the ollama-data volume; pull them once with
  # `docker compose exec ollama ollama pull <tag>` (OPERATIONS §9). To route
  # adapter-less text requests here, set ADAPTA_SERVING_BACKEND=ollama on `app`.
  # ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.12.6
    container_name: adapta-ollama
    profiles: [ollama]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - adapta-network
    logging: *default-logging

networks:
  adapta-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  prometheus-data:
  grafana-data:
  ollama-data:
