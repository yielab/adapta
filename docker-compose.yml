# Shared log-rotation policy — keeps container logs from growing unbounded (§4.4).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ──────────────────────────────────────────────
  # Main application: control plane + RAG serving
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: brain-app
    ports:
      - "8000:8000"
    volumes:
      - ./data/models:/app/data/models
      - ./data/uploads:/app/data/uploads
      - ./data/adapters:/app/data/adapters
      - ./data/datasets:/app/data/datasets
    environment:
      # Defaults to production for the prod baseline; the dev override forces
      # development. In production the config validator fails fast on weak
      # secrets / default DB password (§4.3).
      - BRAIN_ENVIRONMENT=${BRAIN_ENVIRONMENT:-production}
      - BRAIN_DATABASE_URL=postgresql+asyncpg://brain:${POSTGRES_PASSWORD:-brain}@postgres:5432/brain
      - BRAIN_REDIS_URL=redis://redis:6379/0
      # Falls back to the known-default, which the production config validator
      # REJECTS — a prod boot without a real BRAIN_SECRET_KEY crashes fast with a
      # clear message; dev (BRAIN_ENVIRONMENT=development) is unaffected.
      - BRAIN_SECRET_KEY=${BRAIN_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_use_openssl_rand_hex_32}
      - BRAIN_MODELS_DIR=/app/data/models
      - BRAIN_UPLOADS_DIR=/app/data/uploads
      - BRAIN_ADAPTERS_DIR=/app/data/adapters
      - BRAIN_DATASETS_DIR=/app/data/datasets
      - BRAIN_CHROMA_HOST=chroma
      - BRAIN_CHROMA_PORT=8000
      - BRAIN_N_GPU_LAYERS=${BRAIN_N_GPU_LAYERS:-0}
      - BRAIN_N_THREADS=${BRAIN_N_THREADS:-8}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - brain-network

  # ──────────────────────────────────────────────
  # Training worker: consumes Redis queue, runs QLoRA on the GPU (the default).
  # The worker reserves the host GPU (deploy.resources.reservations below), so the
  # default stack requires the NVIDIA Container Toolkit on the host (see README
  # "GPU"). For a rare CPU-only host, layer docker-compose.cpu.yml to drop the
  # reservation — the worker then starts but rejects LoRA jobs fast (GPU guard).
  # ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: brain-worker
    volumes:
      - ./data/models:/app/data/models
      - ./data/adapters:/app/data/adapters
      - ./data/datasets:/app/data/datasets
    environment:
      - BRAIN_ENVIRONMENT=${BRAIN_ENVIRONMENT:-production}
      - BRAIN_DATABASE_URL=postgresql+asyncpg://brain:${POSTGRES_PASSWORD:-brain}@postgres:5432/brain
      - BRAIN_REDIS_URL=redis://redis:6379/0
      - BRAIN_SECRET_KEY=${BRAIN_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_use_openssl_rand_hex_32}
      - BRAIN_MODELS_DIR=/app/data/models
      - BRAIN_ADAPTERS_DIR=/app/data/adapters
      - BRAIN_DATASETS_DIR=/app/data/datasets
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Graceful shutdown: the worker requeues its in-flight job on SIGTERM, so give
    # it time to cancel cleanly before Docker SIGKILLs it (§4.4).
    stop_grace_period: 60s
    healthcheck:
      # A silently dead/hung worker still looks `Up`; the heartbeat key it refreshes
      # in Redis expires if it stops looping, flipping this red (§4.4).
      test: ["CMD", "python", "-m", "brain.worker.main", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8g
    # GPU is the default — the worker gets the host GPU for QLoRA training via CDI
    # (Container Device Interface). Requires the NVIDIA Container Toolkit on the host
    # (`nvidia-ctk` generates /etc/cdi or /var/run/cdi/nvidia.yaml; the enabled
    # nvidia-cdi-refresh.service keeps it current). Docker 25+ resolves GPUs through
    # CDI — the legacy `deploy.resources.reservations.devices: {driver: nvidia}`
    # plugin path is NOT available on this host. On a CPU-only host, opt out with
    # `-f docker-compose.cpu.yml` (which !resets the devices list).
    devices:
      - "nvidia.com/gpu=all"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - brain-network

  # ──────────────────────────────────────────────
  # PostgreSQL: metadata store
  # ──────────────────────────────────────────────
  postgres:
    # Pinned to a specific minor for reproducible customer installs (A4.12);
    # patch upgrades within 15.x are data-compatible.
    image: postgres:15.17-alpine
    container_name: brain-postgres
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: brain
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not host-published in the prod baseline (internal network only). The dev
    # override re-publishes 5432 for local debugging (§4.3).
    networks:
      - brain-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ──────────────────────────────────────────────
  # Redis: job queue
  # ──────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine  # pinned minor for reproducible installs (A4.12)
    container_name: brain-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - brain-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ──────────────────────────────────────────────
  # ChromaDB: per-project vector collections (RAG)
  # Pinned version — update in sync with brain/services/rag.py client usage.
  # ──────────────────────────────────────────────
  chroma:
    # Pinned in sync with the chromadb client in pyproject.toml — a client/server
    # API skew (e.g. 1.x client vs 0.6.x server) breaks collection creation with
    # KeyError('_type'). Keep these two versions equal.
    image: chromadb/chroma:1.5.9
    container_name: brain-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/data
    networks:
      - brain-network
    security_opt:
      - no-new-privileges:true
    # No container healthcheck: the chroma 1.x image ships only the `chroma`
    # binary (no curl/wget/python), so it can't self-probe its own HTTP heartbeat.
    # Dependents gate on `service_started` instead; the app connects to Chroma
    # lazily (per index/retrieve) and retries, and /health/deep probes it live.
    restart: unless-stopped
    logging: *default-logging

  # ──────────────────────────────────────────────
  # Observability (optional) — `docker compose --profile observability up -d`.
  # Off by default; scrapes the app's /metrics (§3.5).
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: brain-prometheus
    profiles: [observability]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - brain-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: brain-grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - brain-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

networks:
  brain-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  prometheus-data:
  grafana-data:
