# Adapta — local stack. One way to run it: `docker compose up -d --build`
# (or `make up`). The repo is bind-mounted into app and worker, so host edits are
# live (uvicorn hot-reloads); the toolchain is baked into the app image, so
# `docker compose exec app make ci` works with zero setup.
#
# GPU is the DEFAULT: the worker reserves the host GPU for QLoRA training. On a
# host without the NVIDIA Container Toolkit, layer docker-compose.cpu.yml.

# Pin the compose project name so image/volume/network prefixes are stable
# (`adapta_*`) regardless of the checkout directory name.
name: adapta

# Shared log-rotation policy — keeps container logs from growing unbounded (§4.4).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ──────────────────────────────────────────────
  # Main application: control plane + RAG serving
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: adapta-app
    ports:
      - "8000:8000"
    volumes:
      # Live source: host edits restart the server (ADAPTA_RELOAD). /app/data
      # rides along — uploads/models/adapters/datasets live in ./data on the host.
      - .:/app
    environment:
      - ADAPTA_DATABASE_URL=postgresql+asyncpg://adapta:${POSTGRES_PASSWORD:-adapta}@postgres:5432/adapta
      - ADAPTA_REDIS_URL=redis://redis:6379/0
      - ADAPTA_SECRET_KEY=${ADAPTA_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_use_openssl_rand_hex_32}
      - ADAPTA_RELOAD=1
      # Seed a default admin (admin@example.com / admin12345) on an empty DB so
      # the console works on first boot. Set 0 to use the register flow instead.
      - ADAPTA_SEED_DEFAULT_ADMIN=${ADAPTA_SEED_DEFAULT_ADMIN:-1}
      - ADAPTA_N_GPU_LAYERS=${ADAPTA_N_GPU_LAYERS:-0}
      - ADAPTA_N_THREADS=${ADAPTA_N_THREADS:-8}
      # Max distinct models the serving cache keeps resident (LRU-evicted past this).
      # Default 2; drop to 1 on low-RAM hosts that serve several large fine-tunes (each
      # 3B GGUF is ~2 GB in CPU RAM, so several at once can exhaust the box).
      - ADAPTA_MAX_LOADED_MODELS=${ADAPTA_MAX_LOADED_MODELS:-2}
    deploy:
      resources:
        limits:
          memory: 4g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - adapta-network

  # ──────────────────────────────────────────────
  # Training worker: consumes Redis queue, runs QLoRA on the GPU (the default).
  # On a CPU-only host, layer docker-compose.cpu.yml to drop the reservation —
  # the worker then starts but rejects LoRA jobs fast (GPU guard).
  # ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: adapta-worker
    volumes:
      - .:/app  # live source for worker code too
    environment:
      - ADAPTA_DATABASE_URL=postgresql+asyncpg://adapta:${POSTGRES_PASSWORD:-adapta}@postgres:5432/adapta
      - ADAPTA_REDIS_URL=redis://redis:6379/0
      - ADAPTA_SECRET_KEY=${ADAPTA_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_use_openssl_rand_hex_32}
    # Graceful shutdown: the worker requeues its in-flight job on SIGTERM, so give
    # it time to cancel cleanly before Docker SIGKILLs it (§4.4).
    stop_grace_period: 60s
    healthcheck:
      # A silently dead/hung worker still looks `Up`; the heartbeat key it refreshes
      # in Redis expires if it stops looping, flipping this red (§4.4).
      test: ["CMD", "python", "-m", "adapta.worker.main", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8g
    # GPU is the default — the worker gets the host GPU for QLoRA training via CDI
    # (Container Device Interface). Requires the NVIDIA Container Toolkit on the host
    # (`nvidia-ctk` generates /etc/cdi or /var/run/cdi/nvidia.yaml; the enabled
    # nvidia-cdi-refresh.service keeps it current). Docker 25+ resolves GPUs through
    # CDI — the legacy `deploy.resources.reservations.devices: {driver: nvidia}`
    # plugin path is NOT available on this host. On a CPU-only host, opt out with
    # `-f docker-compose.cpu.yml` (which !resets the devices list).
    devices:
      - "nvidia.com/gpu=all"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - adapta-network

  # ──────────────────────────────────────────────
  # PostgreSQL: metadata store
  # ──────────────────────────────────────────────
  postgres:
    # Pinned to a specific minor for reproducible installs (A4.12);
    # patch upgrades within 15.x are data-compatible.
    image: postgres:15.17-alpine
    container_name: adapta-postgres
    environment:
      POSTGRES_USER: adapta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adapta}
      POSTGRES_DB: adapta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # published for local debugging (psql from the host)
    networks:
      - adapta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapta"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────────
  # Redis: job queue
  # ──────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine  # pinned minor for reproducible installs (A4.12)
    container_name: adapta-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"  # published for local debugging (redis-cli from the host)
    networks:
      - adapta-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────────
  # ChromaDB: per-project vector collections (RAG)
  # Pinned version — update in sync with adapta/services/rag.py client usage.
  # ──────────────────────────────────────────────
  chroma:
    # Pinned in sync with the chromadb client in pyproject.toml — a client/server
    # API skew (e.g. 1.x client vs 0.6.x server) breaks collection creation with
    # KeyError('_type'). Keep these two versions equal.
    image: chromadb/chroma:1.5.9
    container_name: adapta-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/data
    ports:
      - "8001:8000"  # published for local debugging (Chroma API from the host)
    networks:
      - adapta-network
    # No container healthcheck: the chroma 1.x image ships only the `chroma`
    # binary (no curl/wget/python), so it can't self-probe its own HTTP heartbeat.
    # Dependents gate on `service_started` instead; the app connects to Chroma
    # lazily (per index/retrieve) and retries, and /health/deep probes it live.
    logging: *default-logging

  # ──────────────────────────────────────────────
  # vLLM serving backend (optional, D3) — closes adapter-density gap (§D0 Q3).
  # llama-cpp loads one GPU instance per (base, adapter) key; vLLM packs N text
  # LoRA adapters into one GPU process via continuous batching (max_loras pool).
  #
  # Activate:  docker compose --profile vllm up -d
  # Set on app: ADAPTA_SERVING_BACKEND=vllm in .env (or compose environment block)
  #
  # The ``data/`` volume is shared with app and worker so adapter paths written by
  # the training worker resolve inside this container without extra copies.
  # See OPERATIONS.md §9 for sizing, model download, and rollout guidance.
  # ──────────────────────────────────────────────
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: adapta-vllm
    profiles: [vllm]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      # Mount the same host data dir as app/worker so adapter paths (stored in DB
      # as /app/data/adapters/...) resolve identically inside this container.
      - ./data:/app/data:ro
      - vllm-model-cache:/root/.cache/huggingface  # persist HF model downloads
    ports:
      - "8001:8000"   # host:container — avoids collision with app on 8000
    networks:
      - adapta-network
    command: >
      --model ${VLLM_BASE_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      --enable-lora
      --max-loras ${ADAPTA_VLLM_MAX_LORAS:-8}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
      --host 0.0.0.0
      --port 8000
    devices:
      - "nvidia.com/gpu=all"
    deploy:
      resources:
        limits:
          memory: 16g
    logging: *default-logging

  # ──────────────────────────────────────────────
  # Observability (optional) — `docker compose --profile observability up -d`.
  # Off by default; scrapes the app's /metrics (§3.5).
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: adapta-prometheus
    profiles: [observability]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - adapta-network
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: adapta-grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - adapta-network
    logging: *default-logging

networks:
  adapta-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  prometheus-data:
  grafana-data:
  vllm-model-cache:   # persists HF model downloads across vllm-server container restarts
