services:
  # ──────────────────────────────────────────────
  # Main application: control plane + RAG serving
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: brain-app
    ports:
      - "8000:8000"
    volumes:
      - ./data/models:/app/data/models
      - ./data/uploads:/app/data/uploads
      - ./data/adapters:/app/data/adapters
      - ./data/datasets:/app/data/datasets
    environment:
      - BRAIN_DATABASE_URL=postgresql+asyncpg://brain:brain@postgres:5432/brain
      - BRAIN_REDIS_URL=redis://redis:6379/0
      - BRAIN_SECRET_KEY=${BRAIN_SECRET_KEY:-change_me_in_production}
      - BRAIN_MODELS_DIR=/app/data/models
      - BRAIN_UPLOADS_DIR=/app/data/uploads
      - BRAIN_ADAPTERS_DIR=/app/data/adapters
      - BRAIN_DATASETS_DIR=/app/data/datasets
      - BRAIN_CHROMA_HOST=chroma
      - BRAIN_CHROMA_PORT=8000
      - BRAIN_N_GPU_LAYERS=${BRAIN_N_GPU_LAYERS:-0}
      - BRAIN_N_THREADS=${BRAIN_N_THREADS:-8}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - brain-network

  # ──────────────────────────────────────────────
  # Training worker: consumes Redis queue, runs QLoRA.
  # Requires the [training] extras and a CUDA GPU for real training.
  # On CPU-only hosts it starts but jobs will be slow / rejected by GPU guard.
  # ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: brain-worker
    volumes:
      - ./data/models:/app/data/models
      - ./data/adapters:/app/data/adapters
      - ./data/datasets:/app/data/datasets
    environment:
      - BRAIN_DATABASE_URL=postgresql+asyncpg://brain:brain@postgres:5432/brain
      - BRAIN_REDIS_URL=redis://redis:6379/0
      - BRAIN_MODELS_DIR=/app/data/models
      - BRAIN_ADAPTERS_DIR=/app/data/adapters
      - BRAIN_DATASETS_DIR=/app/data/datasets
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - brain-network
    # Uncomment to enable GPU pass-through (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ──────────────────────────────────────────────
  # PostgreSQL: metadata store
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: brain-postgres
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: brain
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - brain-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Redis: job queue
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: brain-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - brain-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # ChromaDB: per-project vector collections (RAG)
  # Pinned version — update in sync with brain/services/rag.py client usage.
  # ──────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:0.6.3
    container_name: brain-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/data
    ports:
      - "8001:8000"
    networks:
      - brain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  brain-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  chroma-data:
